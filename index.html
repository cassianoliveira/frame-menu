<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu The Frame</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0b0d12;overflow:hidden;width:100%;height:100%}
button{font-family:inherit;outline:none}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:'Inter',Arial,sans-serif;color:#fff;background:#0b0d12;transform-origin:0 0}
.abs{position:absolute}
.btn{border:0;cursor:pointer;color:#fff;transition:transform .22s ease, box-shadow .22s ease, opacity .22s ease, background .22s ease}
.hero-btn{height:72px;padding:0 48px;border-radius:36px;font-size:30px;font-weight:600;margin-right:24px}
.card{position:relative;flex:none;width:326px;height:183px;padding:0;border-radius:20px;overflow:hidden;text-align:left;margin-right:24px}
.tile{flex:none;width:196px;height:110px;padding:0 12px;border-radius:24px;font-size:28px;font-weight:700;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;margin-right:16px}
.dim{opacity:.8}
.lift{transform:scale(1.08) translateY(-6px);box-shadow:0 30px 60px rgba(0,0,0,.6);opacity:1;z-index:2}
.shelf-title{font-size:30px;font-weight:600;color:#f2f4f8;margin-bottom:14px}
.row{display:flex}
.glow{position:absolute;width:1500px;height:900px;left:0;top:0;opacity:0;pointer-events:none;transition:left .6s ease,top .6s ease,opacity .6s ease}
</style>
</head>
<body>
<div id="root">
  <div id="glow0" class="glow"></div><div id="glow1" class="glow"></div>
  <div class="abs" style="left:0;top:0;width:1920px;height:560px;background:linear-gradient(160deg,#1f2d42 0%,#4f6a88 48%,#b8c6d4 100%)">
    <svg viewBox="0 0 1920 560" style="position:absolute;left:0;top:0;width:100%;height:100%" aria-hidden="true">
      <polygon points="0,430 300,350 620,415 980,320 1320,410 1650,335 1920,390 1920,560 0,560" fill="#9fb2c6" opacity="0.55"/>
      <polygon points="0,490 400,450 800,482 1250,435 1650,475 1920,450 1920,560 0,560" fill="#e8eef4"/>
      <polygon points="1290,250 1230,380 1350,380" fill="#1f3040"/>
      <polygon points="1290,305 1215,440 1365,440" fill="#1f3040"/>
      <polygon points="1450,220 1385,350 1515,350" fill="#243749"/>
      <polygon points="1450,280 1370,420 1530,420" fill="#243749"/>
      <polygon points="1610,260 1550,375 1670,375" fill="#1f3040"/>
      <polygon points="1610,315 1535,445 1685,445" fill="#1f3040"/>
      <polygon points="1770,235 1710,355 1830,355" fill="#243749"/>
      <polygon points="1770,290 1695,425 1845,425" fill="#243749"/>
    </svg>
    <div id="heroimg" class="abs" style="left:0;top:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s ease"></div>
    <div class="abs" style="left:0;top:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(8,10,16,.9) 0%,rgba(8,10,16,.62) 44%,rgba(8,10,16,0) 80%)"></div>
    <div class="abs" style="left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(11,13,18,0) 68%,rgba(11,13,18,.96) 100%)"></div>
  </div>

  <div class="abs" style="left:0;top:0;width:1920px;height:90px;box-sizing:border-box;padding:0 96px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:28px;font-weight:700;width:260px">The Frame</div>
    <div style="display:flex;align-items:center">
      <div style="font-size:28px;font-weight:600;padding:10px 30px;border-radius:40px;background:rgba(255,255,255,.2);margin-right:12px">Início</div>
      <div style="font-size:28px;font-weight:600;padding:10px 30px;color:#d5dbe4;margin-right:12px">Quadro</div>
      <div style="font-size:28px;font-weight:600;padding:10px 30px;color:#d5dbe4;margin-right:12px">Apps</div>
      <div style="font-size:28px;font-weight:600;padding:10px 30px;color:#d5dbe4">Ajustes</div>
    </div>
    <div id="clock" style="font-size:28px;font-weight:600;width:260px;text-align:right">12:49</div>
  </div>

  <div class="abs" style="left:96px;top:168px">
    <div id="h-kicker" style="font-size:26px;font-weight:600;letter-spacing:.14em;color:#d5dbe4;margin-bottom:10px">AGORA NA TELA · MODO QUADRO</div>
    <div id="h-titulo" style="font-size:92px;font-weight:700;line-height:1.08;margin-bottom:10px;max-width:1500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Caçadores na Neve</div>
    <div id="h-sub" style="font-size:32px;color:#e6ebf2">Pieter Bruegel, o Velho · 1565 · Clássicos</div>
    <div id="hero" class="row" style="margin-top:28px"></div>
  </div>
  <div class="abs" style="right:96px;top:476px;font-size:22px;color:#e6ebf2;padding:8px 20px;border-radius:20px;background:rgba(8,10,16,.6)"><span id="h-rodizio">Rodízio: a cada 60 min · aleatório</span></div>

  <div class="abs" style="left:96px;top:572px;width:1728px">
    <div style="margin-bottom:56px">
      <div class="shelf-title">Quadro</div>
      <div id="quadro" class="row"></div>
    </div>
    <div class="row">
      <div style="width:832px;margin-right:64px">
        <div class="shelf-title">Meus apps<span style="font-size:20px;font-weight:400;color:#9aa4b2;margin-left:18px">segure OK para trocar</span></div>
        <div id="apps" class="row"></div>
      </div>
      <div style="width:832px">
        <div class="shelf-title">Entradas</div>
        <div id="entradas" class="row"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="abs" style="left:960px;top:104px;display:none;font-size:26px;font-weight:600;padding:14px 30px;border-radius:36px;background:rgba(255,255,255,.94);color:#10131a;box-shadow:0 16px 40px rgba(0,0,0,.5);white-space:nowrap"></div>
</div>

<script>
(function () {
  var quadro = [
    { id: 'natal', name: 'Natal', sub: 'Ativa de 1/nov a 5/jan', a: '#6e1520', b: '#c4453a' },
    { id: 'classicos', name: 'Clássicos', sub: 'Bruegel, Monet, Van Gogh', a: '#26354d', b: '#8ea3bb' },
    { id: 'aquarelas', name: 'Aquarelas', sub: 'Guirlandas, visco, laços', a: '#3f5a48', b: '#b9c8a6' },
    { id: 'vilas', name: 'Vilas de neve', sub: 'Casas, igreja e lago', a: '#101a33', b: '#33527f' },
    { id: 'fotos', name: 'Minhas fotos', sub: 'Suas imagens', a: '#5a4a30', b: '#c2a46c' }
  ];
  var COR_APP = {
    stremio: ['#2a2144', '#5a3f8f'], youtube: ['#33282c', '#574248'], 'apple tv': ['#262a30', '#4a515c'],
    spotify: ['#16301f', '#2f6b46'], netflix: ['#2e1418', '#5a2a30'], 'prime video': ['#1f3040', '#3a5670'],
    'disney+': ['#232c4a', '#3d4d7c']
  };
  function corDe(nome) { return COR_APP[(nome || '').toLowerCase()] || ['#2a2d3a', '#454b5f']; }
  function novoApp(nome, id) { var c = corDe(nome); return { name: nome, id: id || '', a: c[0], b: c[1] }; }
  var PADRAO = ['Stremio', 'YouTube', 'Apple TV', 'Spotify'];
  var apps = PADRAO.map(function (n) { return novoApp(n); });
  try {
    var salvos = JSON.parse(localStorage.getItem('frame.apps') || 'null');
    if (salvos && salvos.length === 4) apps = salvos.map(function (x) { return novoApp(x.name, x.id); });
  } catch (e) {}
  var entradas = [{ name: 'HDMI 1' }, { name: 'HDMI 2' }, { name: 'Espelhar celular' }, { name: 'Ajustes da TV' }];
  var hero = [{ name: 'Próxima obra', primary: true }, { name: 'Fixar esta', primary: false }];
  var baixo = apps.concat(entradas);
  var rows = [hero, quadro, baixo];
  var pos = { r: 1, c: 0 };
  var els = [[], [], []];
  var toastTimer = null;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  hero.forEach(function (it, i) {
    var b = el('button', 'btn hero-btn', it.name);
    b.style.background = it.primary ? '#ffffff' : 'rgba(255,255,255,.22)';
    b.style.color = it.primary ? '#10131a' : '#ffffff';
    document.getElementById('hero').appendChild(b);
    els[0][i] = b;
  });
  quadro.forEach(function (it, i) {
    var b = el('button', 'btn card',
      '<span style="position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(to top,rgba(6,8,14,.74) 0%,rgba(6,8,14,0) 64%)"></span>' +
      '<span style="position:absolute;left:18px;right:18px;bottom:16px;display:block">' +
      '<span style="display:block;font-size:28px;font-weight:700;line-height:1.15">' + it.name + '</span>' +
      '<span style="display:block;font-size:22px;line-height:1.2;color:#e6ebf2;margin-top:2px">' + it.sub + '</span></span>');
    b.style.background = 'linear-gradient(135deg,' + it.a + ',' + it.b + ')';
    document.getElementById('quadro').appendChild(b);
    els[1][i] = b;
  });
  apps.forEach(function (it, i) {
    var b = el('button', 'btn tile', it.name);
    b.style.background = 'linear-gradient(135deg,' + it.a + ',' + it.b + ')';
    document.getElementById('apps').appendChild(b);
    els[2][i] = b;
  });
  entradas.forEach(function (it, i) {
    var b = el('button', 'btn tile', it.name);
    b.style.fontWeight = '600';
    document.getElementById('entradas').appendChild(b);
    els[2][apps.length + i] = b;
  });

  els.forEach(function (lista, r) {
    lista.forEach(function (b, c) {
      b.addEventListener('click', function () { pos = { r: r, c: c }; draw(); acionar(); });
      b.addEventListener('mouseenter', function () { pos = { r: r, c: c }; draw(); });
    });
  });

  var glowAtivo = 0;
  function moverBrilho(tint) {
    var root = document.getElementById('root');
    var rr = root.getBoundingClientRect();
    var s = rr.width / 1920 || 1;
    var f = els[pos.r][pos.c].getBoundingClientRect();
    var cx = (f.left + f.width / 2 - rr.left) / s;
    var cy = (f.top + f.height / 2 - rr.top) / s;
    glowAtivo = 1 - glowAtivo;
    for (var i = 0; i < 2; i++) {
      var g = document.getElementById('glow' + i);
      g.style.left = (cx - 750) + 'px';
      g.style.top = (cy - 450) + 'px';
      if (i === glowAtivo) {
        g.style.background = 'radial-gradient(closest-side, ' + tint + 'a6 0%, ' + tint + '4d 45%, rgba(0,0,0,0) 100%)';
        g.style.opacity = '1';
      } else {
        g.style.opacity = '0';
      }
    }
  }

  function draw() {
    var tint = (pos.r === 0 && corAgora) ? corAgora : '#5b7390';
    if (pos.r === 1) tint = quadro[pos.c].cor || quadro[pos.c].b;
    else if (pos.r === 2 && pos.c < apps.length) tint = apps[pos.c].b;
    moverBrilho(tint);
    els.forEach(function (lista, r) {
      lista.forEach(function (b, c) {
        var f = (r === pos.r && c === pos.c);
        var base = b.className.replace(/\s*(lift|dim)\b/g, '');
        var isEntrada = (r === 2 && c >= apps.length);
        var isHero = (r === 0);
        b.className = base + (f ? ' lift' : (isHero ? '' : ' dim'));
        if (isEntrada) b.style.background = f ? 'rgba(255,255,255,.26)' : 'rgba(255,255,255,.1)';
        b.style.boxShadow = f ? '0 30px 70px ' + tint + '99, 0 10px 30px rgba(0,0,0,.5)' : '';
      });
    });
  }

  function pick() {
    var t = document.getElementById('toast');
    t.textContent = 'Abrir: ' + rows[pos.r][pos.c].name;
    t.style.display = 'block';
    t.style.marginLeft = (-t.offsetWidth / 2) + 'px';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2200);
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, r = pos.r, c = pos.c, len = function (x) { return rows[x].length; };
    if (seletor) { e.preventDefault(); teclaSeletor(k); return; }
    if (k === 405 && pos.r === 2 && pos.c < apps.length) { e.preventDefault(); abrirSeletor(pos.c); return; }
    if (k === 39) c = Math.min(c + 1, len(r) - 1);
    else if (k === 37) c = Math.max(c - 1, 0);
    else if (k === 40) { r = Math.min(r + 1, 2); c = Math.min(c, len(r) - 1); }
    else if (k === 38) { r = Math.max(r - 1, 0); c = Math.min(c, len(r) - 1); }
    else if (k === 13) {
      e.preventDefault();
      if (pos.r === 2 && pos.c < apps.length) {
        if (!enterDown) {
          enterDown = true; enterLongo = false;
          enterTimer = setTimeout(function () { enterLongo = true; abrirSeletor(pos.c); }, 800);
        }
      } else acionar();
      return;
    }
    else if (k === 10009) { e.preventDefault(); sair(); return; }
    else return;
    e.preventDefault();
    pos = { r: r, c: c };
    draw();
  });

  document.addEventListener('keyup', function (e) {
    if (e.keyCode !== 13 || !enterDown) return;
    enterDown = false;
    if (enterTimer) clearTimeout(enterTimer);
    if (!enterLongo && !seletor) acionar();
  });

  function ajustar() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var root = document.getElementById('root');
    root.style.transform = 'scale(' + s + ')';
    root.style.left = Math.max(0, (window.innerWidth - 1920 * s) / 2) + 'px';
  }
  window.addEventListener('resize', ajustar);

  function relogio() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    document.getElementById('clock').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  setInterval(relogio, 30000);


  // ---------------------------------------------------------------- servidor do Mac (artes reais)
  var corAgora = '';
  var SERVIDOR = (location.search.match(/[?&]srv=([^&]+)/) || [0, 'http://192.168.86.63:8765'])[1];
  var avisouServidor = false;

  function chamarServidor(caminho, ok, falha) {
    var x = new XMLHttpRequest();
    x.open('GET', SERVIDOR + caminho, true);
    x.timeout = 30000;
    x.onload = function () {
      try { ok(JSON.parse(x.responseText)); } catch (e) { if (falha) falha(); }
    };
    x.onerror = x.ontimeout = function () { if (falha) falha(); };
    x.send();
  }

  function servidorForaDoAr() {
    if (avisouServidor) return;
    avisouServidor = true;
    document.getElementById('h-rodizio').textContent = 'Servidor do Mac fora do ar';
  }

  function mostrarAgora(d) {
    if (!d || d.erro) { if (d && d.erro) aviso(d.erro); return; }
    document.getElementById('h-titulo').textContent = d.titulo || 'Obra da TV';
    document.getElementById('h-sub').textContent = [d.autor, d.colecao].filter(Boolean).join(' · ');
    corAgora = d.cor || '';
    if (d.imagem) {
      var im = new Image();
      im.onload = function () {
        var h = document.getElementById('heroimg');
        h.style.backgroundImage = 'url(' + SERVIDOR + d.imagem + ')';
        h.style.opacity = '1';
        var svg = document.querySelector('#root svg');
        if (svg) svg.style.display = 'none';
        draw();
      };
      im.src = SERVIDOR + d.imagem;
    }
    draw();
  }

  function carregarAgora() {
    chamarServidor('/api/agora', function (d) { avisouServidor = false; mostrarAgora(d); }, servidorForaDoAr);
  }

  function carregarColecoes() {
    chamarServidor('/api/colecoes', function (lista) {
      avisouServidor = false;
      lista.forEach(function (c) {
        for (var i = 0; i < quadro.length; i++) {
          if (quadro[i].id !== c.id) continue;
          quadro[i].cor = c.cor || '';
          if (c.capa) {
            els[1][i].style.background = "url('" + SERVIDOR + c.capa + "') center/cover, " + quadro[i].a;
          }
        }
      });
      draw();
    }, servidorForaDoAr);
  }

  // ---------------------------------------------------------------- apps e entradas da TV
  var instalados = [];
  function carregarApps() {
    try {
      tizen.application.getAppsInfo(function (lista) { instalados = lista || []; }, function () {});
    } catch (e) {}
  }

  function achar(padroes) {
    for (var p = 0; p < padroes.length; p++) {
      for (var i = 0; i < instalados.length; i++) {
        var a = instalados[i];
        if (padroes[p].test(a.name || '') || padroes[p].test(a.id || '')) return a.id;
      }
    }
    return null;
  }

  var CONHECIDOS = {
    'Netflix': { re: [/^netflix$/i, /netflix/i], ids: ['org.tizen.netflix-app', 'RN1MCdNq8t.Netflix'] },
    'YouTube': { re: [/^youtube$/i, /TizenYouTube$/i, /^youtube(?!.*(kids|tv|music))/i], ids: ['9Ur5IzDKqV.TizenYouTube'] },
    'Prime Video': { re: [/prime ?video/i, /amazon/i], ids: ['evKhCgZelL.AmazonIgnitionLauncher2', 'org.tizen.primevideo'] },
    'Disney+': { re: [/disney/i], ids: [] },
    'Stremio': { re: [/stremio/i], ids: [] },
    'Apple TV': { re: [/^apple ?tv/i, /appletv/i], ids: [] },
    'Spotify': { re: [/spotify/i], ids: ['rJeHak5zRg.Spotify'] },
    'Espelhar celular': { re: [/screen ?mirroring|smart ?view|espelh/i, /airplay/i, /smart ?things/i], ids: [] }
  };

  function lancar(ids, i, nome) {
    if (i >= ids.length) { aviso('Não consegui abrir ' + nome + ' nesta TV'); return; }
    try {
      tizen.application.launch(ids[i], function () {}, function () { lancar(ids, i + 1, nome); });
    } catch (e) {
      aviso(typeof tizen === 'undefined' ? 'Isto só abre apps dentro da TV' : 'Erro ao abrir ' + nome);
    }
  }

  function abrirApp(nome, idEscolhido) {
    var c = CONHECIDOS[nome] || { re: [], ids: [] };
    var ids = [];
    if (idEscolhido) ids.push(idEscolhido);
    if (!idEscolhido && !CONHECIDOS[nome]) { var pelo = achar([new RegExp('^' + nome.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i')]); if (pelo) ids.push(pelo); }
    var achado = achar(c.re);
    if (achado && ids.indexOf(achado) < 0) ids.push(achado);
    c.ids.forEach(function (x) { if (ids.indexOf(x) < 0) ids.push(x); });
    if (!ids.length) { aviso(nome + ' não está instalado nesta TV'); return; }
    aviso('Abrindo ' + nome + '...');
    lancar(ids, 0, nome);
  }

  function abrirHdmi(n) {
    try {
      tizen.systeminfo.getPropertyValue('VIDEOSOURCE', function (v) {
        var todas = ((v && v.connected) || []).concat((v && v.disconnected) || []);
        var fonte = null;
        for (var i = 0; i < todas.length; i++) if (todas[i].type === 'HDMI' && todas[i].number === n) fonte = todas[i];
        if (!fonte) { aviso('HDMI ' + n + ' não encontrada'); return; }
        try {
          tizen.tvwindow.setSource(fonte, function () {
            tizen.application.launch('org.tizen.tv-viewer', function () {}, function () {});
          }, function () { aviso('A TV recusou trocar para HDMI ' + n); });
        } catch (e) { aviso('Sem permissão para trocar de entrada aqui'); }
      }, function () { aviso('A TV não informou as entradas'); });
    } catch (e) { aviso('Sem permissão para trocar de entrada aqui'); }
  }

  function abrirAjustes() {
    function menu() { lancar(['org.tizen.menu'], 0, 'os ajustes'); }
    try {
      var ctl = new tizen.ApplicationControl('http://tizen.org/appcontrol/operation/setting', null, null, null, []);
      tizen.application.launchAppControl(ctl, null, function () {}, menu);
    } catch (e) { menu(); }
  }

  function sair() {
    try { tizen.application.getCurrentApplication().exit(); } catch (e) { history.back(); }
  }

  // ---------------------------------------------------------------- o que cada botão faz
  function aviso(txt) {
    var t = document.getElementById('toast');
    t.textContent = txt;
    t.style.display = 'block';
    t.style.marginLeft = (-t.offsetWidth / 2) + 'px';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2800);
  }

  function acionar() {
    var nome = rows[pos.r][pos.c].name;
    if (pos.r === 0) {
      if (pos.c === 0) {
        aviso('Trocando de obra...');
        chamarServidor('/api/proxima', mostrarAgora, function () { aviso('Servidor do Mac fora do ar'); });
      } else {
        chamarServidor('/api/fixar', function (d) {
          if (d.erro) { aviso(d.erro); return; }
          var h = document.getElementById('h-rodizio');
          h.textContent = d.fixada ? 'Obra fixada · rodízio desligado' : 'Rodízio: a cada 60 min · aleatório';
          aviso(d.fixada ? 'Obra fixada' : 'Rodízio ligado');
        }, function () { aviso('Servidor do Mac fora do ar'); });
      }
    } else if (pos.r === 1) {
      aviso('Mostrando: ' + nome);
      chamarServidor('/api/mostrar?id=' + quadro[pos.c].id, mostrarAgora, function () { aviso('Servidor do Mac fora do ar'); });
    } else if (nome === 'HDMI 1') abrirHdmi(1);
    else if (nome === 'HDMI 2') abrirHdmi(2);
    else if (nome === 'Ajustes da TV') abrirAjustes();
    else abrirApp(nome, pos.r === 2 && pos.c < apps.length ? apps[pos.c].id : '');
  }


  // ---------------------------------------------------------------- escolher os apps de "Meus apps"
  var OCULTOS = new RegExp('^(org\\.volt\\.|org\\.tizen\\.(?!browser$|netflix|primevideo$|globoplay)|org\\.tizen\\.netflixlowmem$|ise-|ug-|d75857a5-)' +
      '|[Ss]ervice$|[Dd]aemon|Preview$|syspopup|[Hh]elper$|AdPlayer|AdSuite|[Kk]eyboard|\\.OTApp$' +
      '|^com\\.samsung\\.(calendar-account-manager|tv\\.(cobalt-|aria-(dummy|engine)|airplay-app|ambient-support|' +
      'built-in-app-info-viewer|commonsearch|searchall|preview-|tv-scheduler|csfs|notification-app|mycontents|' +
      'safLaunchBridge|shortcut|remote-workspace|voiceassistant|mybixby|weather-viewer))');
  var seletor = null;
  var enterDown = false, enterLongo = false, enterTimer = null;

  function abrirSeletor(slot) {
    var lista = [];
    for (var i = 0; i < instalados.length; i++) {
      var a = instalados[i];
      if (!a.id || !a.name || OCULTOS.test(a.id)) continue;
      lista.push({ name: a.name, id: a.id });
    }
    lista.sort(function (x, y) { return x.name.toLowerCase() < y.name.toLowerCase() ? -1 : 1; });
    if (!lista.length) { aviso('Não consegui listar os apps desta TV'); return; }
    lista.unshift({ name: 'Voltar ao padrão: ' + PADRAO[slot], id: '', padrao: true });
    seletor = { slot: slot, lista: lista, i: 0 };
    var raiz = document.getElementById('root');
    var painel = document.createElement('div');
    painel.id = 'seletor';
    painel.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(8,10,16,.99);z-index:20;overflow:hidden';
    var t = document.createElement('div');
    t.style.cssText = 'position:absolute;left:96px;top:60px;font-size:44px;font-weight:700';
    t.textContent = 'Escolha o app da posição ' + (slot + 1);
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:96px;top:122px;font-size:24px;color:#9aa4b2';
    d.textContent = 'Setas para andar, OK para escolher, Voltar para cancelar';
    var grade = document.createElement('div');
    grade.id = 'grade';
    grade.style.cssText = 'position:absolute;left:96px;top:190px;width:1740px;height:840px;overflow:hidden';
    var caixa = document.createElement('div');
    caixa.id = 'caixa';
    caixa.style.cssText = 'position:relative;display:flex;flex-wrap:wrap;transition:margin-top .2s ease';
    lista.forEach(function (it, n) {
      var b = el('div', 'btn tile', it.name);
      b.style.cssText = 'width:272px;height:96px;margin:0 18px 18px 0;font-size:26px;font-weight:600;padding:0 14px;box-sizing:border-box;background:rgba(255,255,255,.1);border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden';
      it.el = b;
      caixa.appendChild(b);
    });
    grade.appendChild(caixa);
    painel.appendChild(t); painel.appendChild(d); painel.appendChild(grade);
    raiz.appendChild(painel);
    pintarSeletor();
  }

  function pintarSeletor() {
    seletor.lista.forEach(function (it, n) {
      var f = n === seletor.i;
      it.el.style.background = f ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.1)';
      it.el.style.color = f ? '#10131a' : '#ffffff';
      it.el.style.transform = f ? 'scale(1.06)' : 'none';
    });
    var linha = Math.floor(seletor.i / 6);
    var visiveis = 7;
    var topo = Math.max(0, linha - (visiveis - 2));
    document.getElementById('caixa').style.marginTop = (-topo * 114) + 'px';
  }

  function fecharSeletor() {
    var p = document.getElementById('seletor');
    if (p) p.parentNode.removeChild(p);
    seletor = null;
  }

  function escolherNoSeletor() {
    var it = seletor.lista[seletor.i], slot = seletor.slot;
    var novo = it.padrao ? novoApp(PADRAO[slot]) : novoApp(it.name, it.id);
    apps[slot] = novo;
    var b = els[2][slot];
    b.textContent = novo.name;
    b.style.background = 'linear-gradient(135deg,' + novo.a + ',' + novo.b + ')';
    baixo[slot] = novo;
    try { localStorage.setItem('frame.apps', JSON.stringify(apps.map(function (x) { return { name: x.name, id: x.id }; }))); } catch (e) {}
    fecharSeletor();
    draw();
    aviso(it.padrao ? 'Voltou ao padrão' : 'Agora: ' + novo.name);
  }

  function teclaSeletor(k) {
    var n = seletor.lista.length, i = seletor.i;
    if (k === 39) i = Math.min(i + 1, n - 1);
    else if (k === 37) i = Math.max(i - 1, 0);
    else if (k === 40) i = Math.min(i + 6, n - 1);
    else if (k === 38) i = Math.max(i - 6, 0);
    else if (k === 13) { escolherNoSeletor(); return; }
    else if (k === 10009 || k === 27) { fecharSeletor(); return; }
    seletor.i = i;
    pintarSeletor();
  }

  setInterval(carregarAgora, 60000);

  ajustar();
  relogio();
  draw();
  carregarApps();
  carregarAgora();
  carregarColecoes();
})();
</script>
</body>
</html>
